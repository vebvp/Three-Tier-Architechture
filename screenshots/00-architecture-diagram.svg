<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 890" width="1100" height="890" font-family="Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#37474F"/>
    </marker>
  </defs>

  <!-- background -->
  <rect width="1100" height="890" fill="#FFFFFF"/>

  <!-- title -->
  <text x="550" y="32" text-anchor="middle" font-size="22" font-weight="bold" fill="#212121">Three-Tier Architecture on AWS · Mumbai (ap-south-1)</text>

  <!-- internet + IGW -->
  <rect x="480" y="50" width="140" height="42" rx="21" fill="#ECEFF1" stroke="#455A64" stroke-width="1.5"/>
  <text x="550" y="76" text-anchor="middle" font-size="14" font-weight="bold" fill="#263238">Internet / Users</text>
  <line x1="550" y1="92" x2="550" y2="122" stroke="#37474F" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="465" y="122" width="170" height="34" rx="6" fill="#EDE7F6" stroke="#6A1B9A" stroke-width="1.5"/>
  <text x="550" y="144" text-anchor="middle" font-size="13" font-weight="bold" fill="#4A148C">Internet Gateway</text>

  <!-- VPC -->
  <rect x="30" y="170" width="1040" height="670" rx="12" fill="#FAFAFA" stroke="#455A64" stroke-width="2" stroke-dasharray="8 4"/>
  <text x="50" y="192" font-size="14" font-weight="bold" fill="#37474F">VPC: ThreeTierArchitechtureVPC · 10.0.0.0/16</text>

  <!-- ========== PUBLIC BAND ========== -->
  <rect x="50" y="205" width="480" height="105" rx="8" fill="#E8F5E9" stroke="#2E7D32" stroke-width="1.5"/>
  <rect x="570" y="205" width="480" height="105" rx="8" fill="#E8F5E9" stroke="#2E7D32" stroke-width="1.5"/>
  <text x="62" y="225" font-size="12" font-weight="bold" fill="#1B5E20">PUBLIC TIER</text>
  <text x="62" y="300" font-size="11" fill="#1B5E20">PublicSubnet1 · 10.0.0.0/20 · ap-south-1a</text>
  <text x="1038" y="300" text-anchor="end" font-size="11" fill="#1B5E20">PublicSubnet2 · 10.0.16.0/20 · ap-south-1b</text>

  <rect x="320" y="240" width="460" height="50" rx="8" fill="#EDE7F6" stroke="#6A1B9A" stroke-width="2"/>
  <text x="550" y="260" text-anchor="middle" font-size="14" font-weight="bold" fill="#4A148C">Web Application Load Balancer</text>
  <text x="550" y="278" text-anchor="middle" font-size="11" fill="#4A148C">internet-facing · WebAlbSG (HTTP 80 from 0.0.0.0/0)</text>

  <line x1="550" y1="156" x2="550" y2="240" stroke="#37474F" stroke-width="2" marker-end="url(#arr)"/>
  <text x="560" y="226" font-size="11" fill="#37474F">HTTP 80</text>

  <!-- ========== WEB BAND ========== -->
  <rect x="50" y="330" width="480" height="135" rx="8" fill="#E3F2FD" stroke="#1565C0" stroke-width="1.5"/>
  <rect x="570" y="330" width="480" height="135" rx="8" fill="#E3F2FD" stroke="#1565C0" stroke-width="1.5"/>
  <text x="62" y="350" font-size="12" font-weight="bold" fill="#0D47A1">WEB TIER</text>
  <text x="62" y="457" font-size="11" fill="#0D47A1">WebSubnet1 · 10.0.32.0/20 · ap-south-1a</text>
  <text x="1038" y="457" text-anchor="end" font-size="11" fill="#0D47A1">WebSubnet2 · 10.0.48.0/20 · ap-south-1b</text>

  <rect x="150" y="365" width="800" height="80" rx="8" fill="none" stroke="#E65100" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="550" y="400" text-anchor="middle" font-size="11" font-style="italic" fill="#BF360C">Auto Scaling Group</text>
  <text x="550" y="416" text-anchor="middle" font-size="11" font-style="italic" fill="#BF360C">Web tier</text>

  <rect x="170" y="375" width="260" height="60" rx="6" fill="#FFF3E0" stroke="#E65100" stroke-width="1.5"/>
  <text x="300" y="398" text-anchor="middle" font-size="13" font-weight="bold" fill="#BF360C">EC2 · Nginx (Web)</text>
  <text x="300" y="417" text-anchor="middle" font-size="11" fill="#BF360C">index.html, style.css · WebEc2SG</text>
  <rect x="670" y="375" width="260" height="60" rx="6" fill="#FFF3E0" stroke="#E65100" stroke-width="1.5"/>
  <text x="800" y="398" text-anchor="middle" font-size="13" font-weight="bold" fill="#BF360C">EC2 · Nginx (Web)</text>
  <text x="800" y="417" text-anchor="middle" font-size="11" fill="#BF360C">index.html, style.css · WebEc2SG</text>

  <line x1="400" y1="290" x2="300" y2="375" stroke="#37474F" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="700" y1="290" x2="800" y2="375" stroke="#37474F" stroke-width="2" marker-end="url(#arr)"/>

  <!-- ========== APP BAND ========== -->
  <rect x="50" y="485" width="480" height="215" rx="8" fill="#E3F2FD" stroke="#1565C0" stroke-width="1.5"/>
  <rect x="570" y="485" width="480" height="215" rx="8" fill="#E3F2FD" stroke="#1565C0" stroke-width="1.5"/>
  <text x="62" y="505" font-size="12" font-weight="bold" fill="#0D47A1">APP TIER</text>
  <text x="62" y="692" font-size="11" fill="#0D47A1">AppSubnet1 · 10.0.64.0/20 · ap-south-1a</text>
  <text x="1038" y="692" text-anchor="end" font-size="11" fill="#0D47A1">AppSubnet2 · 10.0.80.0/20 · ap-south-1b</text>

  <rect x="320" y="510" width="460" height="50" rx="8" fill="#EDE7F6" stroke="#6A1B9A" stroke-width="2"/>
  <text x="550" y="530" text-anchor="middle" font-size="14" font-weight="bold" fill="#4A148C">Internal Application Load Balancer</text>
  <text x="550" y="548" text-anchor="middle" font-size="11" fill="#4A148C">internal · AppAlbSG (HTTP 80 from WebEc2SG)</text>

  <rect x="150" y="600" width="800" height="80" rx="8" fill="none" stroke="#E65100" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="550" y="635" text-anchor="middle" font-size="11" font-style="italic" fill="#BF360C">Auto Scaling Group</text>
  <text x="550" y="651" text-anchor="middle" font-size="11" font-style="italic" fill="#BF360C">App tier</text>

  <rect x="170" y="610" width="260" height="60" rx="6" fill="#FFF3E0" stroke="#E65100" stroke-width="1.5"/>
  <text x="300" y="633" text-anchor="middle" font-size="13" font-weight="bold" fill="#BF360C">EC2 · Nginx + PHP-FPM (App)</text>
  <text x="300" y="652" text-anchor="middle" font-size="11" fill="#BF360C">register.php, entries.php, db.php · AppEc2SG</text>
  <rect x="670" y="610" width="260" height="60" rx="6" fill="#FFF3E0" stroke="#E65100" stroke-width="1.5"/>
  <text x="800" y="633" text-anchor="middle" font-size="13" font-weight="bold" fill="#BF360C">EC2 · Nginx + PHP-FPM (App)</text>
  <text x="800" y="652" text-anchor="middle" font-size="11" fill="#BF360C">register.php, entries.php, db.php · AppEc2SG</text>

  <!-- web EC2 -> internal ALB -->
  <line x1="300" y1="435" x2="400" y2="510" stroke="#37474F" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="800" y1="435" x2="700" y2="510" stroke="#37474F" stroke-width="2" marker-end="url(#arr)"/>
  <text x="550" y="479" text-anchor="middle" font-size="11" font-style="italic" fill="#37474F">*.php → proxy_pass</text>

  <!-- internal ALB -> app EC2 -->
  <line x1="400" y1="560" x2="300" y2="610" stroke="#37474F" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="700" y1="560" x2="800" y2="610" stroke="#37474F" stroke-width="2" marker-end="url(#arr)"/>

  <!-- ========== DB BAND ========== -->
  <rect x="50" y="720" width="480" height="100" rx="8" fill="#F3E5F5" stroke="#7B1FA2" stroke-width="1.5"/>
  <rect x="570" y="720" width="480" height="100" rx="8" fill="#F3E5F5" stroke="#7B1FA2" stroke-width="1.5"/>
  <text x="62" y="740" font-size="12" font-weight="bold" fill="#4A148C">DATABASE TIER</text>
  <text x="62" y="812" font-size="11" fill="#4A148C">DbSubnet1 · 10.0.96.0/20 · ap-south-1a</text>
  <text x="1038" y="812" text-anchor="end" font-size="11" fill="#4A148C">DbSubnet2 · 10.0.112.0/20 · ap-south-1b</text>

  <rect x="380" y="745" width="340" height="50" rx="8" fill="#E1F5FE" stroke="#0277BD" stroke-width="2"/>
  <text x="550" y="766" text-anchor="middle" font-size="14" font-weight="bold" fill="#01579B">Amazon RDS MySQL</text>
  <text x="550" y="784" text-anchor="middle" font-size="11" fill="#01579B">registration_db · DbSG (3306 from AppEc2SG)</text>

  <!-- app EC2 -> RDS -->
  <line x1="300" y1="670" x2="470" y2="745" stroke="#37474F" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="800" y1="670" x2="630" y2="745" stroke="#37474F" stroke-width="2" marker-end="url(#arr)"/>
  <text x="550" y="714" text-anchor="middle" font-size="11" font-style="italic" fill="#37474F">MySQL 3306</text>

  <!-- legend -->
  <rect x="50" y="858" width="14" height="14" fill="#E8F5E9" stroke="#2E7D32"/>
  <text x="70" y="870" font-size="11" fill="#37474F">Public subnet</text>
  <rect x="170" y="858" width="14" height="14" fill="#E3F2FD" stroke="#1565C0"/>
  <text x="190" y="870" font-size="11" fill="#37474F">Private subnet (Web / App)</text>
  <rect x="350" y="858" width="14" height="14" fill="#F3E5F5" stroke="#7B1FA2"/>
  <text x="370" y="870" font-size="11" fill="#37474F">Private subnet (DB)</text>
  <rect x="500" y="858" width="14" height="14" fill="#EDE7F6" stroke="#6A1B9A"/>
  <text x="520" y="870" font-size="11" fill="#37474F">Load balancer / IGW</text>
  <rect x="660" y="858" width="14" height="14" fill="#FFF3E0" stroke="#E65100"/>
  <text x="680" y="870" font-size="11" fill="#37474F">EC2 instance</text>
  <rect x="780" y="858" width="14" height="14" fill="none" stroke="#E65100" stroke-dasharray="3 2"/>
  <text x="800" y="870" font-size="11" fill="#37474F">Auto Scaling Group</text>
</svg>
